<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Torneos{% endblock %} | Admin</title>
  
  <!-- Bootstrap 5, Bootstrap Icons & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Poppins', sans-serif;
      color: #333;
    }
    .navbar {
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
    }
    .navbar-brand {
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .card {
      border-radius: 12px;
    }
    .table-hover tbody tr:hover {
      background-color: #f8f9fa;
      transition: background-color 0.2s ease;
    }
    .btn {
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'torneos:juego_list' %}">
        <i class="bi bi-controller text-primary fs-4"></i>
        <span>SynthesQ Torneos</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'juego_list' %}active{% endif %}" href="{% url 'torneos:juego_list' %}">
              <i class="bi bi-joystick me-1"></i> Juegos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'torneo_list' %}active{% endif %}" href="{% url 'torneos:torneo_list' %}">
              <i class="bi bi-trophy me-1"></i> Torneos
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show shadow-sm border-0" role="alert">
          <i class="bi bi-check-circle-fill me-2"></i>{{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
